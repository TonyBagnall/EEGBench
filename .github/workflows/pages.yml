name: Deploy Leaderboard Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build interactive leaderboards
        run: |
          python -m neuroverse.experiments.tables
          mkdir -p _site/neuroverse _site/neuroverse_paper_2026
          cp -r results/neuroverse/*.html _site/neuroverse/
          cp -r results/neuroverse_paper_2026/*.html _site/neuroverse_paper_2026/
          cat << 'EOF' > _site/index.html
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=neuroverse/leaderboard.html">
            <title>Neuroverse Leaderboard</title>
          </head>
          <body>
            <p>Redirecting to <a href="neuroverse/leaderboard.html">Neuroverse Leaderboard</a>...</p>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
